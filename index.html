<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Cloud Widget</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#111}
main{max-width:480px;margin:auto;padding:24px 16px;text-align:center}
.card{background:#fff;border-radius:14px;padding:24px 16px}
h1{font-size:26px;margin:8px 0 12px}
p{font-size:17px;line-height:1.5}
button{font-size:17px;padding:12px 20px;border:0;border-radius:8px;background:#2878dc;color:#fff}
</style>
</head>
<body>
<main><div class="card">
<h1>My Cloud Widget</h1>
<p>Hello! Your Cloud Phone widget is working.</p>
<button onclick="document.getElementById('msg').textContent='Button works!'">Test</button>
<p id="msg"></p>
</div></main>
</body>
</html>
